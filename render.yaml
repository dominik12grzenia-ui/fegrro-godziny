services:
  - type: web
    name: fegrro-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      # All sensitive values must be set in Render Dashboard (Settings -> Environment)
      # sync: false means: do NOT commit the value, prompt user in Render UI
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: fegrro_db
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://fegrro-godziny.vercel.app,https://godziny.fegrro.pl
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_EXCEL_FILE
        value: "Wypłaty  główny.xlsx"
      - key: ONEDRIVE_FILE_PATH
        value: "3. Finanse firmowe/Bilans 2026/Wypłaty  główny.xlsx"
      - key: ONEDRIVE_ARCHIVE_FOLDER
        value: Archiwizacja
      - key: GOOGLE_MAPS_API_KEY
        sync: false
